version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - misspell
    - revive
    - unconvert
  exclusions:
    presets:
      - std-error-handling
    rules:
      # Wails generates this directory; it is not ours to lint.
      - path: frontend/wailsjs
        linters:
          - revive

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
